name: FX research
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reference_only:
        description: Use only the reference provider for a research check
        type: boolean
        default: false
  schedule:
    # Collect before the ChatGPT task's top-of-hour report.
    - cron: '47 * * * *'
permissions:
  contents: read
concurrency:
  group: fx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - run: python -m unittest discover -v
  analyze:
    needs: tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -c requirements.lock.txt
      - name: Collect market data and enforce quality
        if: ${{ !inputs.reference_only }}
        run: python fx.py --secondary-reference --allow-partial-research
      - name: Verify research report with reference data only
        if: ${{ inputs.reference_only }}
        run: python fx.py --reference-only --allow-partial-research
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fx-report
          path: report.json
          if-no-files-found: error
          retention-days: 7
