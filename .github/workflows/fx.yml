name: FX research
on:
  push:
    paths: ['fx.py', '.github/workflows/fx.yml']
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: python fx.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-report
          path: report.json
